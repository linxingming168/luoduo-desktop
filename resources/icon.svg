<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="64" fill="url(#bg)"/>
  <!-- 大脑图标 -->
  <g transform="translate(256,240)" fill="none" stroke="white" stroke-width="3">
    <!-- 大脑轮廓 -->
    <path d="M-80,-40 C-100,-60 -100,-100 -70,-110 C-40,-120 0,-90 0,-90 C0,-90 40,-120 70,-110 C100,-100 100,-60 80,-40 C100,-20 100,20 80,40 C90,60 80,90 60,100 C30,110 0,80 0,80 C0,80 -30,110 -60,100 C-80,90 -90,60 -80,40 C-100,20 -100,-20 -80,-40Z" stroke-width="3.5" fill="rgba(255,255,255,0.08)"/>
    <!-- 左半球 -->
    <path d="M0,-90 C0,-90 -40,-120 -70,-110 C-100,-100 -100,-60 -80,-40 C-100,-20 -100,20 -80,40 C-90,60 -80,90 -60,100 C-30,110 0,80 0,80" stroke-width="3"/>
    <!-- 右半球 -->
    <path d="M0,-90 C0,-90 40,-120 70,-110 C100,-100 100,-60 80,-40 C100,-20 100,20 80,40 C90,60 80,90 60,100 C30,110 0,80 0,80" stroke-width="3"/>
    <!-- 脑沟回 -->
    <path d="M-30,-70 Q-20,-50 -40,-30" stroke-width="2"/>
    <path d="M30,-70 Q20,-50 40,-30" stroke-width="2"/>
    <path d="M-50,-10 Q-30,10 -50,30" stroke-width="2"/>
    <path d="M50,-10 Q30,10 50,30" stroke-width="2"/>
    <path d="M-20,20 Q0,40 -20,60" stroke-width="2"/>
    <path d="M20,20 Q0,40 20,60" stroke-width="2"/>
  </g>
  <!-- AI 文字 -->
  <text x="256" y="340" text-anchor="middle" fill="white" font-size="36" font-weight="bold" font-family="Arial,sans-serif">AI军团</text>
  <text x="256" y="370" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="16" font-family="Arial,sans-serif">落朵大脑</text>
</svg>
